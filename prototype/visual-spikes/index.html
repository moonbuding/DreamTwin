<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DreamTwin Visual Spikes</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./shared/visual-spikes.css" />
  </head>
  <body>
    <main class="experience-shell">
      <section class="intro">
        <p class="eyebrow">DreamTwin Visual Spikes</p>
        <h1>Canvas 2D vs Three.js</h1>
        <p class="intro-copy">先看效果，再决定正式 MVP 是否接入 3D 视觉增强。</p>
      </section>

      <section class="comparison-grid" aria-label="DreamTwin 视觉对比">
        <article class="scene-row">
          <header class="scene-header">
            <p class="scene-kicker">Scene 01</p>
            <h2>背景梦境空间</h2>
          </header>
          <div class="scene-pair">
            <figure class="scene-card">
              <figcaption>Canvas 2D</figcaption>
              <canvas data-canvas-scene="background"></canvas>
            </figure>
            <figure class="scene-card scene-card-strong">
              <figcaption>Three.js</figcaption>
              <canvas data-three-scene="background"></canvas>
            </figure>
          </div>
        </article>

        <article class="scene-row">
          <header class="scene-header">
            <p class="scene-kicker">Scene 02</p>
            <h2>梦境星图</h2>
          </header>
          <div class="scene-pair">
            <figure class="scene-card">
              <figcaption>Canvas 2D</figcaption>
              <canvas data-canvas-scene="star-map"></canvas>
            </figure>
            <figure class="scene-card scene-card-strong">
              <figcaption>Three.js</figcaption>
              <canvas data-three-scene="star-map"></canvas>
            </figure>
          </div>
        </article>

        <article class="scene-row">
          <header class="scene-header">
            <p class="scene-kicker">Scene 03</p>
            <h2>梦境门打开</h2>
          </header>
          <div class="scene-pair">
            <figure class="scene-card">
              <figcaption>Canvas 2D</figcaption>
              <canvas data-canvas-scene="dream-gate"></canvas>
            </figure>
            <figure class="scene-card scene-card-strong">
              <figcaption>Three.js</figcaption>
              <canvas data-three-scene="dream-gate"></canvas>
            </figure>
          </div>
        </article>
      </section>
    </main>

    <script type="module" src="./shared/visual-spikes.js"></script>
  </body>
</html>
