<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DreamTwins · UI 风格探索</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gallery-bg: #0e0f16;
    --gallery-panel: #16171f;
    --gallery-text: #eef0f6;
    --gallery-muted: #9aa0b4;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  body {
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(120, 140, 255, 0.12), transparent 60%),
      radial-gradient(900px 500px at 90% 0%, rgba(255, 120, 200, 0.1), transparent 60%),
      var(--gallery-bg);
    color: var(--gallery-text);
    min-height: 100vh;
    padding: 40px 24px 80px;
  }
  .page-head { max-width: 1240px; margin: 0 auto 36px; }
  .page-head .eyebrow {
    color: #8b93ff; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  }
  .page-head h1 { font-size: 30px; font-weight: 700; margin: 10px 0 8px; letter-spacing: -0.01em; }
  .page-head p { color: var(--gallery-muted); font-size: 15px; line-height: 1.6; max-width: 720px; }

  .grid {
    max-width: 1240px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px; justify-items: center;
  }
  .variant { width: 300px; }
  .variant-label { margin-top: 16px; }
  .variant-label .nm { display: flex; align-items: baseline; gap: 8px; }
  .variant-label .nm b { font-size: 17px; font-weight: 700; }
  .variant-label .nm em { color: var(--gallery-muted); font-style: normal; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
  .variant-label .desc { color: var(--gallery-muted); font-size: 13px; line-height: 1.55; margin-top: 5px; }
  .variant-label .tag {
    display: inline-block; margin-top: 9px; padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.06); color: #c8cde0; border: 1px solid rgba(255,255,255,0.09);
  }

  /* ---------- phone frame (shared) ---------- */
  .phone {
    width: 300px; height: 620px; border-radius: 38px; padding: 9px;
    background: #0b0c12; box-shadow: 0 30px 70px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.06);
    position: relative;
  }
  .screen {
    width: 100%; height: 100%; border-radius: 30px; overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  .scr-body { flex: 1; display: flex; flex-direction: column; padding: 46px 20px 0; position: relative; z-index: 2; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 700; margin-bottom: 22px;
  }
  .topbar .brand { display: inline-flex; align-items: center; gap: 7px; letter-spacing: 0.01em; }
  .topbar .brand .mk { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; display: inline-block; }
  .topbar .t { font-variant-numeric: tabular-nums; opacity: 0.7; font-weight: 600; }

  .greet .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 9px; }
  .greet h1 { font-size: 27px; font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; }
  .greet .sub { font-size: 13px; margin-top: 7px; line-height: 1.5; }

  .orb-wrap { position: relative; height: 168px; display: grid; place-items: center; margin: 18px 0 6px; }
  .orb {
    width: 124px; height: 124px; border-radius: 50%; position: relative;
    animation: float 7s ease-in-out infinite;
  }
  .orb::after {
    content: ""; position: absolute; inset: -34px; border-radius: 50%;
    border: 1px solid currentColor; opacity: 0.16;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 0.9; } }

  .cards { display: flex; flex-direction: column; gap: 11px; margin-top: 6px; }
  .card { display: flex; align-items: center; gap: 13px; padding: 14px; border-radius: 18px; }
  .card .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: 0 0 auto; }
  .card .ic svg { width: 19px; height: 19px; }
  .card .tx { flex: 1; min-width: 0; }
  .card .tx b { display: block; font-size: 14px; font-weight: 600; }
  .card .tx small { display: block; font-size: 12px; margin-top: 2px; }
  .card .chev { opacity: 0.5; }
  .avatars { display: inline-flex; }
  .avatars span { width: 26px; height: 26px; border-radius: 50%; margin-left: -8px; border: 2px solid; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

  .cta { margin-top: auto; margin-bottom: 14px; height: 50px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; }

  .nav {
    display: flex; justify-content: space-around; align-items: center;
    padding: 11px 8px 16px; position: relative; z-index: 2;
  }
  .nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; }
  .nav a svg { width: 21px; height: 21px; }

  /* ===================================================================
     VARIANT 1 — 极光夜 Aurora (dark glass, aurora glow)
     =================================================================== */
  .v-aurora .screen {
    background: linear-gradient(180deg, #0a0d1f 0%, #0c1026 55%, #080a18 100%);
    color: #eaf0ff;
  }
  .v-aurora .screen::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(380px 240px at 20% 8%, rgba(80, 220, 255, 0.26), transparent 60%),
      radial-gradient(420px 260px at 88% 14%, rgba(180, 110, 255, 0.26), transparent 62%),
      radial-gradient(360px 300px at 60% 96%, rgba(255, 110, 200, 0.16), transparent 60%);
  }
  .v-aurora .topbar .brand { color: #7fe3ff; }
  .v-aurora .greet .kicker { color: #7fe3ff; }
  .v-aurora .greet .sub { color: #aab6e0; }
  .v-aurora .orb {
    background: radial-gradient(circle at 36% 30%, rgba(255,255,255,0.8), transparent 42%),
      conic-gradient(from 180deg, #57e1ff, #9a7bff 45%, #ff7ccf 70%, #57e1ff);
    box-shadow: 0 0 50px rgba(120, 180, 255, 0.55), 0 0 110px rgba(180, 120, 255, 0.32);
    color: #aee8ff;
  }
  .v-aurora .card {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(160,190,255,0.16);
    backdrop-filter: blur(14px);
  }
  .v-aurora .card .ic { background: rgba(127, 227, 255, 0.15); color: #7fe3ff; }
  .v-aurora .card .tx small { color: #97a3cc; }
  .v-aurora .avatars span { border-color: #0c1026; background: linear-gradient(135deg, #7fe3ff, #b79bff); color: #07112a; }
  .v-aurora .cta { background: linear-gradient(135deg, #6fe6ff, #b29bff 55%, #ff9cd9); color: #071026; box-shadow: 0 16px 40px rgba(120,180,255,0.34); }
  .v-aurora .nav { border-top: 1px solid rgba(160,190,255,0.12); background: rgba(8,10,24,0.5); color: #6b779e; }
  .v-aurora .nav a.on { color: #7fe3ff; }

  /* ===================================================================
     VARIANT 2 — 云屿 Cloud (light, airy pastel)
     =================================================================== */
  .v-cloud .screen { background: #fcfbff; color: #21243a; }
  .v-cloud .screen::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(360px 260px at 12% 4%, rgba(184, 170, 255, 0.4), transparent 62%),
      radial-gradient(380px 280px at 95% 12%, rgba(255, 196, 222, 0.42), transparent 62%),
      radial-gradient(320px 300px at 70% 100%, rgba(168, 232, 224, 0.36), transparent 62%);
  }
  .v-cloud .topbar .brand { color: #8b7be8; }
  .v-cloud .topbar .t { color: #9a93b8; }
  .v-cloud .greet .kicker { color: #a08fef; }
  .v-cloud .greet .sub { color: #807a98; }
  .v-cloud .orb {
    background: radial-gradient(circle at 36% 30%, #ffffff, transparent 46%),
      linear-gradient(150deg, #c3b6ff, #ffc2e0 52%, #b6ece3);
    box-shadow: 0 22px 50px rgba(170, 150, 255, 0.35);
    color: #c7bbff;
  }
  .v-cloud .card { background: #ffffff; border: 1px solid rgba(33,36,58,0.06); box-shadow: 0 8px 22px rgba(120,110,170,0.1); }
  .v-cloud .card .ic { background: rgba(160, 143, 239, 0.14); color: #8b7be8; }
  .v-cloud .card .tx small { color: #8a849f; }
  .v-cloud .avatars span { border-color: #fff; background: linear-gradient(135deg, #c3b6ff, #ffc2e0); color: #4a3f7a; }
  .v-cloud .cta { background: linear-gradient(135deg, #b3a4ff, #ffb6da); color: #3a2f63; box-shadow: 0 16px 36px rgba(170,150,255,0.32); }
  .v-cloud .nav { border-top: 1px solid rgba(33,36,58,0.06); background: rgba(255,255,255,0.7); color: #aaa3bd; }
  .v-cloud .nav a.on { color: #8b7be8; }

  /* ===================================================================
     VARIANT 3 — 墨光 Ink (minimal mono + warm accent, editorial)
     =================================================================== */
  .v-ink .screen { background: #f5f2ec; color: #1b1a17; }
  .v-ink .screen::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(300px 240px at 78% 10%, rgba(214, 138, 92, 0.16), transparent 64%);
  }
  .v-ink .topbar .brand { color: #1b1a17; }
  .v-ink .topbar .t { color: #9a948a; }
  .v-ink .greet .kicker { color: #c2734a; }
  .v-ink .greet h1 { font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif; font-weight: 600; letter-spacing: 0; }
  .v-ink .greet .sub { color: #6f695e; }
  .v-ink .orb {
    background: radial-gradient(circle at 38% 32%, rgba(255,255,255,0.9), transparent 40%),
      radial-gradient(circle at 60% 70%, #e8a06f, #d6753f 60%, #b9551f);
    box-shadow: 0 18px 44px rgba(200, 120, 70, 0.3);
    color: #cf8a5a;
  }
  .v-ink .orb::after { opacity: 0.28; }
  .v-ink .card { background: transparent; border: 1px solid rgba(27,26,23,0.14); }
  .v-ink .card .ic { background: rgba(194, 115, 74, 0.12); color: #c2734a; border-radius: 10px; }
  .v-ink .card .tx small { color: #837c70; }
  .v-ink .avatars span { border-color: #f5f2ec; background: #ddd3c4; color: #5a5346; }
  .v-ink .cta { background: #1b1a17; color: #f5f2ec; border-radius: 14px; }
  .v-ink .nav { border-top: 1px solid rgba(27,26,23,0.1); color: #9a948a; }
  .v-ink .nav a.on { color: #1b1a17; }

  /* ===================================================================
     VARIANT 4 — 晕彩 Mesh (vibrant soft mesh on white, modern)
     =================================================================== */
  .v-mesh .screen { background: #ffffff; color: #1d2030; }
  .v-mesh .screen::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(300px 300px at 8% 0%, rgba(124, 92, 255, 0.5), transparent 55%),
      radial-gradient(320px 320px at 100% 6%, rgba(0, 214, 200, 0.42), transparent 55%),
      radial-gradient(360px 340px at 86% 100%, rgba(255, 122, 150, 0.4), transparent 58%),
      radial-gradient(320px 300px at 0% 96%, rgba(255, 196, 92, 0.36), transparent 58%);
    filter: saturate(1.05);
  }
  .v-mesh .topbar .brand { color: #6a4dff; }
  .v-mesh .topbar .t { color: #8b90a6; }
  .v-mesh .greet .kicker { color: #6a4dff; }
  .v-mesh .greet .sub { color: #6f7488; }
  .v-mesh .orb {
    background: radial-gradient(circle at 34% 28%, rgba(255,255,255,0.85), transparent 44%),
      conic-gradient(from 30deg, #7c5cff, #00d6c8 30%, #ff7a96 62%, #ffc45c 82%, #7c5cff);
    box-shadow: 0 20px 54px rgba(124, 92, 255, 0.34);
    color: #b9a8ff;
  }
  .v-mesh .card { background: rgba(255,255,255,0.72); border: 1px solid rgba(29,32,48,0.06); backdrop-filter: blur(16px); box-shadow: 0 10px 26px rgba(80,70,140,0.1); }
  .v-mesh .card .ic { background: linear-gradient(135deg, rgba(124,92,255,0.16), rgba(0,214,200,0.16)); color: #6a4dff; }
  .v-mesh .card .tx small { color: #767b8e; }
  .v-mesh .avatars span { border-color: #fff; background: linear-gradient(135deg, #7c5cff, #ff7a96); color: #fff; }
  .v-mesh .cta { background: linear-gradient(135deg, #7c5cff, #00cfc2 55%, #ff7a96); color: #fff; box-shadow: 0 16px 40px rgba(124,92,255,0.36); }
  .v-mesh .nav { border-top: 1px solid rgba(29,32,48,0.06); background: rgba(255,255,255,0.78); color: #9aa0b2; }
  .v-mesh .nav a.on { color: #6a4dff; }

  /* ===================================================================
     VARIANT 5 — 星浮 Starlit (warm dark plum, rose-gold, romantic)
     =================================================================== */
  .v-star .screen { background: linear-gradient(180deg, #221026 0%, #1a0c20 55%, #140817 100%); color: #f4e9f2; }
  .v-star .screen::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(360px 240px at 22% 8%, rgba(255, 198, 140, 0.22), transparent 60%),
      radial-gradient(400px 260px at 90% 16%, rgba(255, 138, 196, 0.24), transparent 62%),
      radial-gradient(2px 2px at 30% 40%, rgba(255,240,210,0.9), transparent),
      radial-gradient(2px 2px at 70% 30%, rgba(255,220,240,0.8), transparent),
      radial-gradient(1.5px 1.5px at 50% 62%, rgba(255,240,210,0.7), transparent),
      radial-gradient(1.5px 1.5px at 82% 70%, rgba(255,220,240,0.7), transparent);
  }
  .v-star .topbar .brand { color: #ffc896; }
  .v-star .topbar .t { color: #c9a8c2; }
  .v-star .greet .kicker { color: #ffb3d0; }
  .v-star .greet .sub { color: #cbabc6; }
  .v-star .orb {
    background: radial-gradient(circle at 36% 30%, rgba(255,255,255,0.85), transparent 42%),
      linear-gradient(150deg, #ffd6a0, #ff9ec4 55%, #c77bff);
    box-shadow: 0 0 48px rgba(255, 180, 200, 0.45), 0 0 100px rgba(255, 150, 120, 0.25);
    color: #ffc7dd;
  }
  .v-star .card { background: rgba(255,236,246,0.07); border: 1px solid rgba(255,200,220,0.16); backdrop-filter: blur(12px); }
  .v-star .card .ic { background: rgba(255, 178, 208, 0.16); color: #ffb3d0; }
  .v-star .card .tx small { color: #c2a3bd; }
  .v-star .avatars span { border-color: #1a0c20; background: linear-gradient(135deg, #ffd6a0, #ff9ec4); color: #4a1030; }
  .v-star .cta { background: linear-gradient(135deg, #ffd09a, #ff9ec4 60%, #c98bff); color: #3a0f2a; box-shadow: 0 16px 40px rgba(255,160,190,0.32); }
  .v-star .nav { border-top: 1px solid rgba(255,200,220,0.12); background: rgba(20,8,23,0.5); color: #a585a0; }
  .v-star .nav a.on { color: #ffc896; }
</style>
</head>
<body>
  <!-- icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="M12 7l1.6 3.4L17 12l-3.4 1.6L12 17l-1.6-3.4L7 12l3.4-1.6z"/></symbol>
      <symbol id="i-door" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V3h-4"/><path d="M10 12h.01"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></symbol>
      <symbol id="i-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M15 9l-2 5-4 1 2-5z"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.5 7.2L4 20l.8-4.5A8 8 0 1 1 20 12z"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
    </defs>
  </svg>

  <div class="page-head">
    <p class="eyebrow">DreamTwins · UI 风格探索</p>
    <h1>简约而梦幻 — 5 个方向，先挑一个你喜欢的</h1>
    <p>同一个「今日」首页,用 5 种不同的视觉语言呈现:深空极光、柔光云屿、墨色留白、晕彩玻璃、暖夜星浮。挑一个方向告诉我,我再把它细化到全套界面。</p>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    const screenHTML = `
      <div class="scr-body">
        <div class="topbar">
          <span class="brand"><span class="mk"></span>DreamTwins</span>
          <span class="t">23:58</span>
        </div>
        <div class="greet">
          <p class="kicker">AI 双人关系预演</p>
          <h1>晚安，星河</h1>
          <p class="sub">昨夜，你的分身遇见了 3 个人</p>
        </div>
        <div class="orb-wrap"><div class="orb"></div></div>
        <div class="cards">
          <div class="card">
            <span class="ic"><svg><use href="#i-sparkle"/></svg></span>
            <span class="tx"><b>今日梦境</b><small>3 段新的关系预演在等你</small></span>
            <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
          </div>
          <div class="card">
            <span class="ic"><svg><use href="#i-door"/></svg></span>
            <span class="tx"><b>梦境门打开</b><small>2 段梦境已开启聊天</small></span>
            <span class="avatars"><span>她</span><span>他</span></span>
          </div>
        </div>
        <div class="cta">想进入一个梦境</div>
      </div>
      <div class="nav">
        <a class="on"><svg><use href="#i-home"/></svg>今日</a>
        <a><svg><use href="#i-compass"/></svg>广场</a>
        <a><svg><use href="#i-moon"/></svg>梦境</a>
        <a><svg><use href="#i-chat"/></svg>好友</a>
        <a><svg><use href="#i-user"/></svg>我的</a>
      </div>`;

    const variants = [
      { cls: "v-aurora", nm: "极光夜", en: "Aurora", tag: "深色 · 梦幻", desc: "深空玻璃 + 极光辉光。神秘、沉浸,最贴近 DreamTwins「梦境」气质。" },
      { cls: "v-cloud", nm: "云屿", en: "Cloud", tag: "亮色 · 柔和", desc: "奶白底 + 薰衣草/桃粉柔光晕。轻盈、治愈、亲和,像 Soul 但更梦。" },
      { cls: "v-ink", nm: "墨光", en: "Ink", tag: "极简 · 高级", desc: "暖白留白 + 单一暖橘点缀 + 衬线标题。克制、编辑感、质感强。" },
      { cls: "v-mesh", nm: "晕彩", en: "Mesh", tag: "明亮 · 现代", desc: "白底 + 多彩柔光网格 + 磨砂玻璃卡。年轻、鲜活又干净。" },
      { cls: "v-star", nm: "星浮", en: "Starlit", tag: "暖夜 · 浪漫", desc: "深梅紫底 + 玫瑰金星尘。温暖、暧昧、有恋爱感的夜色。" },
    ];

    document.getElementById("grid").innerHTML = variants.map(v => `
      <div class="variant">
        <div class="phone ${v.cls}"><div class="screen">${screenHTML}</div></div>
        <div class="variant-label">
          <div class="nm"><b>${v.nm}</b><em>${v.en}</em></div>
          <div class="desc">${v.desc}</div>
          <span class="tag">${v.tag}</span>
        </div>
      </div>`).join("");
  </script>
</body>
</html>
