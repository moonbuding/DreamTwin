<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DreamTwins · 黑色星空 · 拟玻璃</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif; }
  body {
    background: radial-gradient(1000px 600px at 50% -8%, #0c0e1a, #050609 60%, #030305);
    color: #eef0f6; min-height: 100vh; padding: 40px 24px 80px;
  }
  .page-head { max-width: 1180px; margin: 0 auto 34px; }
  .page-head .eyebrow { color: #8ea0d8; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
  .page-head h1 { font-size: 28px; font-weight: 700; margin: 10px 0 8px; letter-spacing: -0.01em; }
  .page-head p { color: #99a0b6; font-size: 15px; line-height: 1.6; max-width: 760px; }

  .grid { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 34px; justify-items: center; }
  .variant { width: 310px; }
  .variant-label { margin-top: 16px; }
  .variant-label .nm { display: flex; align-items: baseline; gap: 8px; }
  .variant-label .nm b { font-size: 17px; font-weight: 700; }
  .variant-label .nm em { color: #8b91a6; font-style: normal; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
  .variant-label .desc { color: #99a0b6; font-size: 13px; line-height: 1.55; margin-top: 5px; }
  .variant-label .tag { display: inline-block; margin-top: 9px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.05); color: #c2c8db; border: 1px solid rgba(255,255,255,0.08); }

  /* phone */
  .phone { width: 310px; height: 640px; border-radius: 40px; padding: 9px; background: #04050a; box-shadow: 0 36px 80px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05); }
  .screen { width: 100%; height: 100%; border-radius: 32px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #04040a; }
  .stars { position: absolute; inset: 0; z-index: 1; }
  .neb { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .scr-body { flex: 1; display: flex; flex-direction: column; padding: 48px 22px 0; position: relative; z-index: 3; }

  .topbar { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 24px; }
  .topbar .brand { display: inline-flex; align-items: center; gap: 7px; }
  .topbar .brand .mk { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; }
  .topbar .t { font-variant-numeric: tabular-nums; opacity: 0.55; color: #c9cee0; }

  .greet .kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 10px; }
  .greet h1 { font-size: 28px; font-weight: 600; line-height: 1.12; letter-spacing: -0.01em; color: #f3f5fb; }
  .greet .sub { font-size: 13px; margin-top: 8px; line-height: 1.5; color: #9aa1bb; }

  .orb-wrap { position: relative; height: 174px; display: grid; place-items: center; margin: 16px 0 8px; }
  .orb { width: 122px; height: 122px; border-radius: 50%; position: relative; animation: float 8s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* glass cards (shared) */
  .cards { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .card {
    display: flex; align-items: center; gap: 13px; padding: 15px;
    border-radius: 18px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.09);
    -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 10px 30px rgba(0,0,0,0.35);
  }
  .card .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: 0 0 auto; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08); }
  .card .ic svg { width: 19px; height: 19px; }
  .card .tx { flex: 1; min-width: 0; }
  .card .tx b { display: block; font-size: 14px; font-weight: 600; color: #f0f2f8; }
  .card .tx small { display: block; font-size: 12px; margin-top: 2px; color: #969db5; }
  .card .chev { opacity: 0.4; }
  .avatars { display: inline-flex; }
  .avatars span { width: 26px; height: 26px; border-radius: 50%; margin-left: -8px; border: 1.5px solid rgba(8,10,20,0.9); font-size: 11px; font-weight: 700; display: grid; place-items: center; background: rgba(255,255,255,0.16); color: #eef1fb; }

  /* glass CTA (shared, refined — no loud gradient) */
  .cta {
    margin-top: auto; margin-bottom: 16px; height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14); color: #f3f5fb;
  }

  .nav { display: flex; justify-content: space-around; align-items: center; padding: 12px 8px 18px; position: relative; z-index: 3; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(6,7,14,0.4); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: #5e667f; }
  .nav a svg { width: 21px; height: 21px; }

  /* ===== 月域 Lunar — icy silver, moon-like orb ===== */
  .v-lunar .neb { background: radial-gradient(420px 280px at 78% 6%, rgba(120, 150, 210, 0.14), transparent 60%); }
  .v-lunar .topbar .brand { color: #cdd6ee; }
  .v-lunar .greet .kicker { color: #aab6d6; }
  .v-lunar .orb {
    background: radial-gradient(circle at 38% 34%, #ffffff, #d7deef 38%, #97a3c2 66%, #5d678a 90%);
    box-shadow: 0 0 64px rgba(190, 205, 245, 0.34), inset -8px -10px 26px rgba(20,28,55,0.5), inset 6px 6px 18px rgba(255,255,255,0.4);
  }
  .v-lunar .orb::after { content:""; position:absolute; inset:-30px; border-radius:50%; border:1px solid rgba(180,200,245,0.2); }
  .v-lunar .card .ic { color: #b9c5e6; }
  .v-lunar .nav a.on { color: #cdd6ee; }

  /* ===== 星玻 Astral — frosted glass sphere, faint indigo core ===== */
  .v-astral .neb { background: radial-gradient(440px 300px at 24% 6%, rgba(110, 90, 220, 0.16), transparent 60%), radial-gradient(380px 260px at 92% 22%, rgba(70, 120, 200, 0.12), transparent 60%); }
  .v-astral .topbar .brand { color: #b6acff; }
  .v-astral .greet .kicker { color: #a99df0; }
  .v-astral .orb {
    background: radial-gradient(circle at 34% 30%, rgba(255,255,255,0.55), rgba(150,140,235,0.22) 46%, rgba(70,62,130,0.28) 74%, rgba(40,36,80,0.4) 100%);
    border: 1px solid rgba(255,255,255,0.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 0 70px rgba(120, 100, 230, 0.3), inset 8px 8px 24px rgba(255,255,255,0.22), inset -10px -12px 30px rgba(30,24,70,0.5);
  }
  .v-astral .orb::after { content:""; position:absolute; inset:-32px; border-radius:50%; border:1px solid rgba(150,135,245,0.18); }
  .v-astral .card .ic { color: #b6acff; }
  .v-astral .nav a.on { color: #b6acff; }

  /* ===== 辉环 Halo — no filled orb, thin luminous rings + champagne core ===== */
  .v-halo .neb { background: radial-gradient(420px 280px at 50% 30%, rgba(220, 190, 140, 0.1), transparent 62%); }
  .v-halo .topbar .brand { color: #e6d3b4; }
  .v-halo .greet .kicker { color: #d8c098; }
  .v-halo .orb {
    background: radial-gradient(circle, #fff5e4 0 5%, rgba(255, 224, 178, 0.5) 8%, transparent 13%);
    box-shadow: 0 0 36px rgba(255, 215, 160, 0.4);
    animation: float 8s ease-in-out infinite, halopulse 5s ease-in-out infinite;
  }
  @keyframes halopulse { 0%,100% { box-shadow: 0 0 30px rgba(255,215,160,0.3); } 50% { box-shadow: 0 0 46px rgba(255,215,160,0.5); } }
  .v-halo .orb::before, .v-halo .orb::after { content:""; position:absolute; border-radius:50%; border:1px solid rgba(230,205,160,0.32); }
  .v-halo .orb::before { inset:-22px; }
  .v-halo .orb::after { inset:-46px; border-color: rgba(230,205,160,0.16); }
  .v-halo .card .ic { color: #e0c79a; }
  .v-halo .cta { border-color: rgba(230,205,160,0.3); color: #f2e6d0; }
  .v-halo .nav a.on { color: #e6d3b4; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><path d="M12 7l1.5 3.5L17 12l-3.5 1.5L12 17l-1.5-3.5L7 12l3.5-1.5z"/></symbol>
    <symbol id="i-door" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V3h-4"/><path d="M10 12h.01"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M15 9l-2 5-4 1 2-5z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.5 7.2L4 20l.8-4.5A8 8 0 1 1 20 12z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
  </defs></svg>

  <div class="page-head">
    <p class="eyebrow">DreamTwins · 黑色星空 · 拟玻璃</p>
    <h1>深空 · 玻璃 · 简约高级 — 3 个克制方向</h1>
    <p>纯黑底 + 真实星空层 + 磨砂玻璃卡片,几乎不用花哨渐变。三款只是「梦境光体」和点缀色不同:月域(冷银月)、星玻(靛紫玻璃球)、辉环(细光环,无实心球)。挑一个,我再细化全套界面。</p>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    const screenHTML = `
      <canvas class="stars"></canvas>
      <div class="neb"></div>
      <div class="scr-body">
        <div class="topbar"><span class="brand"><span class="mk"></span>DreamTwins</span><span class="t">23:58</span></div>
        <div class="greet"><p class="kicker">AI 双人关系预演</p><h1>晚安，星河</h1><p class="sub">昨夜，你的分身遇见了 3 个人</p></div>
        <div class="orb-wrap"><div class="orb"></div></div>
        <div class="cards">
          <div class="card"><span class="ic"><svg><use href="#i-sparkle"/></svg></span><span class="tx"><b>今日梦境</b><small>3 段新的关系预演在等你</small></span><span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></div>
          <div class="card"><span class="ic"><svg><use href="#i-door"/></svg></span><span class="tx"><b>梦境门打开</b><small>2 段梦境已开启聊天</small></span><span class="avatars"><span>她</span><span>他</span></span></div>
        </div>
        <div class="cta">想进入一个梦境</div>
      </div>
      <div class="nav">
        <a class="on"><svg><use href="#i-home"/></svg>今日</a>
        <a><svg><use href="#i-compass"/></svg>广场</a>
        <a><svg><use href="#i-moon"/></svg>梦境</a>
        <a><svg><use href="#i-chat"/></svg>好友</a>
        <a><svg><use href="#i-user"/></svg>我的</a>
      </div>`;

    const variants = [
      { cls: "v-lunar", nm: "月域", en: "Lunar", tag: "冷银 · 静谧", desc: "纯黑星空 + 冷银月体。安静、克制、高级,几乎零彩色。" },
      { cls: "v-astral", nm: "星玻", en: "Astral", tag: "靛紫 · 玻璃", desc: "磨砂玻璃球,隐约靛紫核光,能透出背后星点。最有「拟玻璃」质感。" },
      { cls: "v-halo", nm: "辉环", en: "Halo", tag: "香槟 · 极简", desc: "不用实心球,只有细光环 + 一点香槟金核心。最极简、最不廉价。" },
    ];

    const grid = document.getElementById("grid");
    grid.innerHTML = variants.map(v => `
      <div class="variant"><div class="phone ${v.cls}"><div class="screen">${screenHTML}</div></div>
      <div class="variant-label"><div class="nm"><b>${v.nm}</b><em>${v.en}</em></div><div class="desc">${v.desc}</div><span class="tag">${v.tag}</span></div></div>`).join("");

    // paint a subtle, layered starfield on each screen's canvas
    function paintStars(canvas) {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = rect.width, h = rect.height;
      canvas.width = w * dpr; canvas.height = h * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, w, h);
      const n = Math.round(w * h / 1600); // density
      for (let i = 0; i < n; i++) {
        const x = Math.random() * w, y = Math.random() * h;
        const r = Math.random() * 0.9 + 0.25;
        const a = Math.random() * 0.5 + 0.12;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill();
      }
      // a few brighter glowing stars
      for (let i = 0; i < 5; i++) {
        const x = Math.random() * w, y = Math.random() * h * 0.7;
        const g = ctx.createRadialGradient(x, y, 0, x, y, 7);
        g.addColorStop(0, "rgba(255,255,255,0.95)");
        g.addColorStop(0.4, "rgba(200,215,255,0.4)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
      }
    }
    requestAnimationFrame(() => document.querySelectorAll(".stars").forEach(paintStars));
  </script>
</body>
</html>
