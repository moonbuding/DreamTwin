<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DreamTwin · 靛紫 / 冰蓝 决选</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif; }
  body { background: radial-gradient(1000px 600px at 50% -8%, #0c0e1a, #050609 60%, #030305); color: #eef0f6; min-height: 100vh; padding: 40px 24px 90px; }
  .page-head { max-width: 1180px; margin: 0 auto 26px; }
  .page-head .eyebrow { color: #8ea0d8; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
  .page-head h1 { font-size: 28px; font-weight: 700; margin: 10px 0 8px; }
  .page-head p { color: #99a0b6; font-size: 15px; line-height: 1.6; max-width: 780px; }

  .section-title { max-width: 1180px; margin: 30px auto 16px; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: #c3c9dc; display: flex; align-items: center; gap: 10px; }
  .section-title::before { content: ""; width: 5px; height: 16px; border-radius: 3px; background: linear-gradient(#a98bff, #6fd3ff); }

  .row { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; justify-items: center; }
  .col-cap { margin-top: 13px; display: flex; align-items: center; gap: 10px; }
  .col-cap .sw { width: 20px; height: 20px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
  .col-cap .nm b { font-size: 15px; font-weight: 700; }
  .col-cap .nm em { color: #8b91a6; font-style: normal; font-size: 11.5px; margin-left: 7px; font-variant-numeric: tabular-nums; }
  .col-cap .desc { color: #99a0b6; font-size: 12px; margin-top: 2px; }

  .phone { width: 300px; height: 600px; border-radius: 38px; padding: 8px; background: #04050a; box-shadow: 0 30px 64px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05); }
  .screen { width: 100%; height: 100%; border-radius: 31px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #04040a; }
  .stars { position: absolute; inset: 0; z-index: 1; }
  .neb { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(420px 280px at 28% 6%, var(--glow), transparent 60%); opacity: 0.5; }
  .scr-body { flex: 1; display: flex; flex-direction: column; padding: 44px 20px 0; position: relative; z-index: 3; }

  .topbar { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 20px; }
  .topbar .brand { display: inline-flex; align-items: center; gap: 7px; color: var(--accent); }
  .topbar .brand .mk { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; box-shadow: 0 0 8px var(--glow); }
  .topbar .t { font-variant-numeric: tabular-nums; opacity: 0.55; color: #c9cee0; }
  .topbar .info { color: #aeb4c8; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); }

  .greet .kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 9px; color: var(--accent); }
  .greet h1 { font-size: 25px; font-weight: 600; line-height: 1.12; color: #f3f5fb; }
  .greet .sub { font-size: 12.5px; margin-top: 7px; color: #9aa1bb; }
  .center-title { text-align: center; }
  .center-title h2 { font-size: 18px; font-weight: 600; color: #f3f5fb; }
  .center-title p { font-size: 12px; color: #9aa1bb; margin-top: 5px; }

  .orb-wrap { position: relative; height: 152px; display: grid; place-items: center; margin: 12px 0 6px; }
  .orb {
    width: 112px; height: 112px; border-radius: 50%; position: relative; animation: float 8s ease-in-out infinite;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.6), color-mix(in srgb, var(--accent) 42%, transparent) 46%, color-mix(in srgb, var(--accent) 30%, #0a0a14) 78%);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 64px var(--glow), inset 8px 8px 22px rgba(255,255,255,0.22), inset -10px -12px 28px rgba(10,10,24,0.5);
  }
  .orb::after { content:""; position:absolute; inset:-28px; border-radius:50%; border:1px solid color-mix(in srgb, var(--accent2, var(--accent)) 32%, transparent); }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  .cards { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .card { display: flex; align-items: center; gap: 12px; padding: 13px; border-radius: 16px; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.09); -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); }
  .card .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: 0 0 auto; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, rgba(255,255,255,0.05)); border: 1px solid color-mix(in srgb, var(--accent) 22%, rgba(255,255,255,0.08)); }
  .card.alt .ic { color: var(--accent2, var(--accent)); background: color-mix(in srgb, var(--accent2, var(--accent)) 12%, rgba(255,255,255,0.05)); border-color: color-mix(in srgb, var(--accent2, var(--accent)) 22%, rgba(255,255,255,0.08)); }
  .card .ic svg { width: 17px; height: 17px; }
  .card .tx { flex: 1; min-width: 0; }
  .card .tx b { display: block; font-size: 13px; font-weight: 600; color: #f0f2f8; }
  .card .tx small { display: block; font-size: 11px; margin-top: 2px; color: #969db5; }
  .card .chev { opacity: 0.4; }
  .avatars { display: inline-flex; }
  .avatars span { width: 24px; height: 24px; border-radius: 50%; margin-left: -8px; border: 1.5px solid rgba(8,10,20,0.9); font-size: 10px; font-weight: 700; display: grid; place-items: center; background: color-mix(in srgb, var(--accent2, var(--accent)) 30%, rgba(255,255,255,0.14)); color: #fff; }

  .cta { margin-top: auto; margin-bottom: 14px; height: 48px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 600; color: #f5f7fc; background: color-mix(in srgb, var(--accent) 16%, rgba(255,255,255,0.04)); border: 1px solid color-mix(in srgb, var(--accent) 42%, rgba(255,255,255,0.12)); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 0 26px var(--glow), inset 0 1px 0 rgba(255,255,255,0.14); }

  /* dream plaza screen */
  .smap { flex: 1; position: relative; margin-top: 6px; }
  .node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 7px; width: 120px; }
  .sorb { width: var(--d,80px); height: var(--d,80px); border-radius: 50%; --c: var(--accent); background: radial-gradient(circle at 36% 30%, rgba(255,255,255,0.55), color-mix(in srgb, var(--c) 42%, transparent) 46%, color-mix(in srgb, var(--c) 30%, #0a0a14) 80%); border: 1px solid rgba(255,255,255,0.18); box-shadow: 0 0 46px color-mix(in srgb, var(--c) 45%, transparent), inset 6px 6px 16px rgba(255,255,255,0.2), inset -8px -10px 22px rgba(10,10,24,0.5); animation: float 9s ease-in-out infinite; }
  .node b { font-size: 12px; font-weight: 600; color: #eef1f8; text-shadow: 0 1px 8px rgba(0,0,0,0.6); }
  .node .pill { font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: color-mix(in srgb, var(--c, var(--accent)) 80%, #fff); background: color-mix(in srgb, var(--c, var(--accent)) 16%, rgba(255,255,255,0.06)); border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 30%, rgba(255,255,255,0.1)); }
  .n1 { left: 27%; top: 30%; } .n1 .sorb { --d: 92px; }
  .n2 { left: 70%; top: 24%; } .n2 .sorb { --d: 74px; }
  .n3 { left: 54%; top: 64%; } .n3 .sorb { --d: 84px; }

  .nav { display: flex; justify-content: space-around; align-items: center; padding: 11px 8px 15px; position: relative; z-index: 3; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(6,7,14,0.4); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: #5e667f; }
  .nav a svg { width: 20px; height: 20px; }
  .nav a.on { color: var(--accent); }

  /* finalists */
  .t-iris { --accent: #a98bff; --glow: rgba(150,110,255,0.32); }
  .t-ice  { --accent: #6fd3ff; --glow: rgba(90,200,255,0.30); }
  .t-duo  { --accent: #a98bff; --glow: rgba(150,110,255,0.30); --accent2: #6fd3ff; --glow2: rgba(90,200,255,0.30); }
  .t-duo .neb { background: radial-gradient(360px 240px at 22% 6%, var(--glow), transparent 60%), radial-gradient(360px 240px at 88% 14%, var(--glow2), transparent 60%); }
  .t-duo .orb { box-shadow: 0 0 60px var(--glow), 0 0 70px -6px var(--glow2), inset 8px 8px 22px rgba(255,255,255,0.22), inset -10px -12px 28px rgba(10,10,24,0.5); }
  .t-duo .n1 .sorb { --c: #a98bff; } .t-duo .n2 .sorb { --c: #8fb4ff; } .t-duo .n3 .sorb { --c: #6fd3ff; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><path d="M12 7l1.5 3.5L17 12l-3.5 1.5L12 17l-1.5-3.5L7 12l3.5-1.5z"/></symbol>
    <symbol id="i-door" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V3h-4"/><path d="M10 12h.01"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M15 9l-2 5-4 1 2-5z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.5 7.2L4 20l.8-4.5A8 8 0 1 1 20 12z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
  </defs></svg>

  <div class="page-head">
    <p class="eyebrow">DreamTwin · 主题色决选</p>
    <h1>靛紫 / 冰蓝 / 双色 — 两个界面里对比</h1>
    <p>正常交友(不只恋爱)的调性。粉色已排除。每个主题色都放在「今日」和「梦境广场」两个界面里看,星图那屏最能看出色彩在多个光球之间的层次。</p>
  </div>

  <div class="section-title">今日 · 首页</div>
  <div class="row" id="row-today"></div>

  <div class="section-title">梦境广场 · 星图</div>
  <div class="row" id="row-plaza"></div>

  <script>
    const todayHTML = `
      <canvas class="stars"></canvas><div class="neb"></div>
      <div class="scr-body">
        <div class="topbar"><span class="brand"><span class="mk"></span>DreamTwin</span><span class="t">23:58</span></div>
        <div class="greet"><p class="kicker">AI 双人关系预演</p><h1>晚安，星河</h1><p class="sub">昨夜，你的分身遇见了 3 个人</p></div>
        <div class="orb-wrap"><div class="orb"></div></div>
        <div class="cards">
          <div class="card"><span class="ic"><svg><use href="#i-sparkle"/></svg></span><span class="tx"><b>今日梦境</b><small>3 段新的关系预演在等你</small></span><span class="chev"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></div>
          <div class="card alt"><span class="ic"><svg><use href="#i-door"/></svg></span><span class="tx"><b>梦境门打开</b><small>2 段梦境已开启聊天</small></span><span class="avatars"><span>她</span><span>他</span></span></div>
        </div>
        <div class="cta">想进入一个梦境</div>
      </div>
      <div class="nav"><a class="on"><svg><use href="#i-home"/></svg>今日</a><a><svg><use href="#i-compass"/></svg>广场</a><a><svg><use href="#i-moon"/></svg>梦境</a><a><svg><use href="#i-chat"/></svg>好友</a><a><svg><use href="#i-user"/></svg>我的</a></div>`;

    const plazaHTML = `
      <canvas class="stars"></canvas><div class="neb"></div>
      <div class="scr-body">
        <div class="topbar"><span></span><span class="info">说明</span></div>
        <div class="center-title"><h2>梦境广场</h2><p>AI 为你预演的关系入口</p></div>
        <div class="smap">
          <div class="node n1"><span class="sorb"></span><b>雨夜便利店</b><span class="pill">等待回应</span></div>
          <div class="node n2"><span class="sorb"></span><b>星空告白</b><span class="pill">未查看</span></div>
          <div class="node n3"><span class="sorb"></span><b>海底探险</b><span class="pill">已打开</span></div>
        </div>
      </div>
      <div class="nav"><a><svg><use href="#i-home"/></svg>今日</a><a><svg><use href="#i-compass"/></svg>广场</a><a class="on"><svg><use href="#i-moon"/></svg>梦境</a><a><svg><use href="#i-chat"/></svg>好友</a><a><svg><use href="#i-user"/></svg>我的</a></div>`;

    const cols = [
      { cls: "t-iris", nm: "靛紫", hex: "#A98BFF", desc: "神秘、浪漫,最贴梦境气质", sw: "#a98bff" },
      { cls: "t-ice",  nm: "冰蓝", hex: "#6FD3FF", desc: "清冷、清澈,科技梦幻", sw: "#6fd3ff" },
      { cls: "t-duo",  nm: "靛紫 × 冰蓝", hex: "主 + 辅", desc: "紫主 + 蓝辅,冷色一脉的星图层次", sw: "linear-gradient(135deg,#a98bff,#6fd3ff)" },
    ];

    const render = (id, inner, withCap) => {
      document.getElementById(id).innerHTML = cols.map(c => `
        <div class="variant ${c.cls}">
          <div class="phone ${c.cls}"><div class="screen">${inner}</div></div>
          ${withCap ? `<div class="col-cap"><span class="sw" style="background:${c.sw}"></span><div><div class="nm"><b>${c.nm}</b><em>${c.hex}</em></div><div class="desc">${c.desc}</div></div></div>` : ``}
        </div>`).join("");
    };
    render("row-today", todayHTML, true);
    render("row-plaza", plazaHTML, false);

    function paintStars(canvas) {
      const rect = canvas.getBoundingClientRect(); const dpr = Math.min(window.devicePixelRatio||1,2);
      const w = rect.width, h = rect.height; if(!w||!h) return;
      canvas.width = w*dpr; canvas.height = h*dpr; const ctx = canvas.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
      const n = Math.round(w*h/1700);
      for (let i=0;i<n;i++){ const x=Math.random()*w,y=Math.random()*h,r=Math.random()*0.85+0.25,a=Math.random()*0.5+0.12; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.fill(); }
      for (let i=0;i<4;i++){ const x=Math.random()*w,y=Math.random()*h*0.7; const g=ctx.createRadialGradient(x,y,0,x,y,6); g.addColorStop(0,"rgba(255,255,255,0.9)"); g.addColorStop(0.4,"rgba(210,220,255,0.4)"); g.addColorStop(1,"rgba(255,255,255,0)"); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill(); }
    }
    requestAnimationFrame(() => document.querySelectorAll(".stars").forEach(paintStars));
  </script>
</body>
</html>
