services:
  mysql:
    image: mysql:8.0
    container_name: dreamtwin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dreamtwin}
      MYSQL_USER: ${MYSQL_USER:-dreamtwin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dreamtwin}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - dreamtwin-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dreamtwin-mysql-data:
