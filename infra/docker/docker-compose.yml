name: dreamtwin

services:
  postgres:
    image: postgres:15-alpine
    container_name: dreamtwin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dreamtwin
      POSTGRES_PASSWORD: dreamtwin
      POSTGRES_DB: dreamtwin
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamtwin -d dreamtwin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
